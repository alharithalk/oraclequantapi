spring.application.name=oraclequantapi

# ===============================
# Oracle XE Datasource (Docker, port 1521)
# ===============================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:oraclequant}
spring.datasource.password=${DB_PASSWORD:oraclequant}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Logging (see logback-spring.xml for console + rolling file appenders)
# ===============================
logging.file.name=logs/oraclequantapi.log
logging.level.root=INFO
logging.level.com.oraclequantapi.oraclequantapi=DEBUG
