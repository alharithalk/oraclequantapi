services:
  oracle-xe:
    image: container-registry.oracle.com/database/express:latest
    container_name: oraclequant-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=29999login
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Auto-creates the oraclequant user/schema in XEPDB1 the FIRST time the
      # database initializes (only runs against an empty oracle-data volume).
      - ./db/setup:/opt/oracle/scripts/setup
    healthcheck:
      test: ["CMD-SHELL", "\"$$ORACLE_BASE/$$CHECK_DB_FILE\" >/dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      start_period: 5m
      retries: 5

  app:
    build: .
    container_name: oraclequantapi
    depends_on:
      oracle-xe:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      - DB_USERNAME=oraclequant
      - DB_PASSWORD=oraclequant
    volumes:
      - ./logs:/app/logs

volumes:
  oracle-data:
